<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff" />
      <stop offset="100%" style="stop-color:#ff00ff" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" fill="#000" rx="8"/>
  
  <!-- Shield with bright glow -->
  <path d="M32 4 L50 14 L50 30 Q50 48 32 60 Q14 48 14 30 L14 14 Z" 
        fill="none" stroke="url(#grad)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Inner shield accent -->
  <path d="M32 10 L46 18 L46 28 Q46 42 32 52 Q18 42 18 28 L18 18 Z" 
        fill="url(#grad)" opacity="0.3"/>
  
  <!-- Center lock -->
  <g transform="translate(32, 32)">
    <rect x="-10" y="-2" width="20" height="14" rx="1.5" fill="none" stroke="url(#grad)" stroke-width="1.5" filter="url(#glow)"/>
    <path d="M-6 -2 Q-6 -6 0 -6 Q6 -6 6 -2" fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="5" r="1.5" fill="url(#grad)"/>
  </g>
</svg>
